name: Build Maw Rakawarana 3D APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q maw_rakawarana3d_project.zip -d project
          ROOT=$(find project -name settings.gradle -printf '%h\n' | head -1)
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          npm install
          npx tailwindcss -i ./src/tailwind-input.css -o ./app/src/main/assets/css/tailwind.css --minify
          node scripts/copy-fontawesome.js
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maw-Rakawarana-3D-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
